---
- name: Ensure Herdr configuration checkout directory exists
  become: false
  ansible.builtin.file:
    path: "{{ herdr_config_checkout | dirname }}"
    state: directory
    mode: "0755"
  tags:
    - herdr
    - ai-agents

- name: Get Herdr configuration repository
  become: false
  ansible.builtin.git:
    repo: "{{ herdr_config_repository }}"
    dest: "{{ herdr_config_checkout }}"
    accept_hostkey: true
    single_branch: true
    version: "{{ herdr_config_version }}"
    update: false
  tags:
    - herdr
    - ai-agents

- name: Ensure Herdr runtime configuration directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/herdr"
    state: directory
    mode: "0755"
  tags:
    - herdr
    - ai-agents

- name: Link tracked Herdr configuration
  become: false
  ansible.builtin.file:
    src: "{{ herdr_config_checkout }}/config.toml"
    dest: "{{ ansible_facts['user_dir'] }}/.config/herdr/config.toml"
    state: link
    force: true
  tags:
    - herdr
    - ai-agents

- name: Ensure Agent Usage plugin configuration directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/herdr/plugins/config/usagebar"
    state: directory
    mode: "0755"
  tags:
    - herdr
    - ai-agents

- name: Link tracked Agent Usage preferences
  become: false
  ansible.builtin.file:
    src: "{{ herdr_config_checkout }}/plugins/usagebar.toml"
    dest: "{{ ansible_facts['user_dir'] }}/.config/herdr/plugins/config/usagebar/config.toml"
    state: link
    force: true
  tags:
    - herdr
    - ai-agents
