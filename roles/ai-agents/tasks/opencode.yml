---
# OpenCode keeps its dependencies (node_modules), cached model data, session
# history, and authentication credentials outside of Git. Check out the
# tracked configuration separately and link only the reviewed files into
# OpenCode's active configuration directory, mirroring the Herdr pattern.
- name: Get OpenCode configuration repository
  become: false
  ansible.builtin.git:
    repo: "{{ opencode_config_repository }}"
    dest: "{{ opencode_config_checkout }}"
    accept_hostkey: true
    single_branch: true
    version: "{{ opencode_config_version }}"
    update: false
  tags:
    - opencode
    - ai-agents

- name: Install OpenCode configuration's npm dependencies
  become: false
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ opencode_config_checkout }}"
    creates: "{{ opencode_config_checkout }}/node_modules"
  tags:
    - opencode
    - ai-agents

- name: Ensure OpenCode runtime configuration directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode"
    state: directory
    mode: "0755"
  tags:
    - opencode
    - ai-agents

- name: Link tracked OpenCode configuration
  become: false
  ansible.builtin.file:
    src: "{{ opencode_config_checkout }}/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/{{ item }}"
    state: link
    force: true
  loop:
    - opencode.jsonc
    - tui.jsonc
  tags:
    - opencode
    - ai-agents

- name: Ensure Neovim plugin directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim/lua/plugins"
    state: directory
    mode: "0755"
  tags:
    - opencode
    - ai-agents

- name: Link tracked OpenCode Neovim integration
  become: false
  ansible.builtin.file:
    src: "{{ opencode_config_checkout }}/integrations/nvim/opencode.lua"
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim/lua/plugins/opencode.lua"
    state: link
    force: true
  tags:
    - opencode
    - ai-agents
