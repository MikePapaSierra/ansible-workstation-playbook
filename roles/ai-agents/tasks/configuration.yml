---
- name: Install Node.js and npm for OpenCode plugins
  become: true
  ansible.builtin.package:
    name:
      - nodejs
      - npm
    state: "{{ pkg_state }}"
  tags:
    - opencode
    - ai-agents

- name: Fetch portable AI agent configuration repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version }}"
    accept_hostkey: true
    single_branch: true
    update: false
  loop: "{{ ai_agent_configuration_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - opencode
    - herdr
    - ai-agents

- name: Install OpenCode plugin dependencies
  ansible.builtin.command: npm ci --ignore-scripts
  args:
    chdir: "{{ ansible_facts['user_dir'] }}/opencode"
    creates: "{{ ansible_facts['user_dir'] }}/opencode/node_modules/@opencode-ai/plugin/package.json"
  tags:
    - opencode
    - ai-agents

- name: Ensure OpenCode and Herdr configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/opencode"
    - "{{ ansible_facts['user_dir'] }}/.config/herdr"
    - "{{ ansible_facts['user_dir'] }}/.config/herdr/plugins/config/usagebar"
  tags:
    - opencode
    - herdr
    - ai-agents

- name: Link OpenCode and Herdr configuration files
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ ansible_facts['user_dir'] }}/opencode/opencode.jsonc"
      dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/opencode.jsonc"
    - src: "{{ ansible_facts['user_dir'] }}/opencode/tui.jsonc"
      dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/tui.jsonc"
    - src: "{{ ansible_facts['user_dir'] }}/herdr/config.toml"
      dest: "{{ ansible_facts['user_dir'] }}/.config/herdr/config.toml"
    - src: "{{ ansible_facts['user_dir'] }}/herdr/plugins/usagebar.toml"
      dest: "{{ ansible_facts['user_dir'] }}/.config/herdr/plugins/config/usagebar/config.toml"
    - src: "{{ ansible_facts['user_dir'] }}/opencode/integrations/nvim/opencode.lua"
      dest: "{{ ansible_facts['user_dir'] }}/.config/nvim/lua/plugins/opencode.lua"
  loop_control:
    label: "{{ item.dest }}"
  tags:
    - opencode
    - herdr
    - neovim
    - ai-agents

- name: Install pinned Herdr plugins
  ansible.builtin.command: >-
    herdr plugin install {{ item.source }} --ref {{ item.ref }} --yes
  loop: "{{ ai_herdr_plugins }}"
  loop_control:
    label: "{{ item.source }}"
  changed_when: false
  tags:
    - herdr
    - ai-agents

- name: Install Herdr OpenCode integration
  ansible.builtin.command: herdr integration install opencode
  changed_when: false
  tags:
    - herdr
    - opencode
    - ai-agents
