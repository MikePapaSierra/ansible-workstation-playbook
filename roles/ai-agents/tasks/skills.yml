---
# Agent Skills are installed with the `skills` CLI (https://skills.sh/),
# invoked through `npx` so no global npm package has to be managed here.
# The CLI itself discovers every agent (Claude, Copilot, OpenCode, etc.) on
# the machine and links each skill into that agent's own skills directory,
# recording what it installed in ~/.agents/.skill-lock.json.
- name: List installed global Agent Skills
  ansible.builtin.command: npx --yes skills list -g --json
  register: _ai_skills_installed
  changed_when: false
  failed_when: false
  when: ai_agent_skills | length > 0
  tags:
    - skills
    - ai-agents

- name: Determine which Agent Skills are already installed
  ansible.builtin.set_fact:
    _ai_skills_installed_names: >-
      {{ (_ai_skills_installed.stdout | default('', true) | trim | default('[]', true) | from_json)
         | map(attribute='name') | list }}
  when: ai_agent_skills | length > 0
  tags:
    - skills
    - ai-agents

- name: Install missing Agent Skills
  ansible.builtin.command: >-
    npx --yes skills add {{ item.package }}
    {{ ('--skill ' + item.skill) if item.skill is defined else '' }}
    --agent {{ item.agents | default('*') }} --global --yes
  loop: "{{ ai_agent_skills }}"
  loop_control:
    label: "{{ item.skill | default(item.package) }}"
  when: (item.skill | default(item.package.split('/')[-1])) not in _ai_skills_installed_names
  tags:
    - skills
    - ai-agents
