---
- name: Create canonical home-directory structure
  become: false
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ home_structure_directories }}"
  tags:
    - home-structure
    - users

- name: Ensure canonical Obsidian vault directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/{{ home_structure_vault_dir }}"
    state: directory
    mode: "0755"
  tags:
    - home-structure
    - users

- name: Check whether the compatibility vault path already exists
  become: false
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/{{ home_structure_vault_symlink }}"
  register: home_structure_vault_symlink_check
  tags:
    - home-structure
    - users

- name: Ensure parent directory of the compatibility vault path exists
  become: false
  ansible.builtin.file:
    path: "{{ (ansible_user_dir + '/' + home_structure_vault_symlink) | dirname }}"
    state: directory
    mode: "0755"
  when: not home_structure_vault_symlink_check.stat.exists
  tags:
    - home-structure
    - users

- name: Create compatibility symlink for the Obsidian vault
  become: false
  ansible.builtin.file:
    src: "{{ ansible_user_dir }}/{{ home_structure_vault_dir }}"
    dest: "{{ ansible_user_dir }}/{{ home_structure_vault_symlink }}"
    state: link
  # Never overwrite a real (non-symlink) path a fresh host/user might already have,
  # e.g. an existing vault restored from backup before this playbook ran.
  when: >
    not home_structure_vault_symlink_check.stat.exists
    or (home_structure_vault_symlink_check.stat.islnk | default(false))
  tags:
    - home-structure
    - users
